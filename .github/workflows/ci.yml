name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser and media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pnpm exec playwright-core install --with-deps chromium

      - name: Typecheck and build
        run: pnpm build

      - name: Channel pagination regression
        run: |
          if node -e "process.exit(require('./package.json').scripts['test:channel-pagination'] ? 0 : 1)"; then
            pnpm test:channel-pagination
          else
            echo "test:channel-pagination not present on this branch yet; skipped until PR #48 lands"
          fi

      - name: API loading states
        run: pnpm test:api-loading

      - name: Mobile layout
        run: pnpm test:mobile-layout

      - name: Diagnostic copy
        run: pnpm test:diagnostic-copy

      - name: Cache scheduler and security regression
        run: |
          pnpm test:cache
          pnpm test:security

      - name: Progress, subtitles and quality regression
        run: pnpm test:playback-local --scenarios subtitles,subtitles-legacy,subtitles-hls,progress,quality,replay,interrupted,autonext,storage

      - name: Playback diagnostics
        run: pnpm test:playback

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: warn

  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev ffmpeg

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri -> target
          key: ci-rust

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked --all-targets

      - name: Cargo unit tests
        working-directory: src-tauri
        run: cargo test --locked --lib

      - name: Local HTTP cache and Linux transport regression
        working-directory: src-tauri
        run: |
          for test in \
            linux_http::tests::range_response_survives_the_linux_socket_transport \
            media::tests::range_cache_local_server \
            media::tests::priority_and_partial_cache_local_server \
            media::tests::inflight_cache_changes_local_server; do
            cargo test --locked --lib "$test" -- --exact --ignored
          done

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium
      - name: Real Rust cache browser regression
        run: pnpm test:playback-local --scenarios cache-resume,mp4-cache
      - name: Upload cache test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cache-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
