name: Native mobile

# 原生安卓 / iOS。推到 main 且动到 native 时自动出未签名包，也可在 Actions 页手动跑。
on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android unsigned APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0"

      - name: 编译未签名 APK
        working-directory: native/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: 收集产物
        run: |
          set -euo pipefail
          mkdir -p artifacts
          f="$(find native/android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$f"
          cp "$f" artifacts/HGhub-android-unsigned.apk
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned
          path: artifacts/HGhub-android-unsigned.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 编译未签名 App
        working-directory: native/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project HGhub.xcodeproj \
            -scheme HGhub \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包未签名 IPA
        working-directory: native/ios
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Release-iphoneos/HGhub.app"
          test -d "$APP"
          rm -rf build/Payload
          mkdir -p build/Payload
          ditto "$APP" build/Payload/HGhub.app
          (cd build && zip -qry HGhub-unsigned.ipa Payload)
          codesign -dv build/Payload/HGhub.app || true
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp build/HGhub-unsigned.ipa "$GITHUB_WORKSPACE/artifacts/HGhub-ios-unsigned.ipa"
          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: artifacts/HGhub-ios-unsigned.ipa
          if-no-files-found: error
